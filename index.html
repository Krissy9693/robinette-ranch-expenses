<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robinette Ranch Expense Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Zilla+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Colors of LS Tractor: Smart Blue tractor body, navy, silver and a red accent */
    :root {
      --bg: #f3ecdc;          /* straw / barn-board cream */
      --card: #fffdf7;
      --text: #14213d;
      --muted: #5a6275;
      --line: #d9cfb8;
      --brand: #1c55b8;       /* tractor blue */
      --brand-dark: #0a1e5a;  /* LS navy */
      --brand-soft: #e4ecfa;
      --silver: #9ea3a6;
      --accent: #fa002d;      /* LS red */
      --error: #b3261e;
      --error-soft: #fcebea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        repeating-linear-gradient(90deg, rgba(120, 90, 40, .05) 0 2px, transparent 2px 90px),
        var(--bg);
      color: var(--text);
      font-family: "Zilla Slab", Georgia, serif;
      font-size: 18px;
      line-height: 1.45;
    }
    main { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
    header {
      background: var(--brand-dark);
      color: #fff;
      margin: 0 -16px 20px;
      padding: 26px 16px 22px;
      text-align: center;
      border-bottom: 6px solid var(--brand);
      box-shadow: inset 0 -10px 0 -6px var(--silver);
    }
    header h1 {
      margin: 0;
      font-family: "Rye", "Zilla Slab", serif;
      font-weight: 400;
      font-size: 38px;
      letter-spacing: 1px;
      line-height: 1.1;
    }
    header h1 .accent { color: #ffd23f; display: block; }
    @media (max-width: 420px) { header h1 { font-size: 30px; } }
    .quote { margin: 12px auto 0; max-width: 420px; color: #cfd8ee; }
    .quote p { margin: 0; font-style: italic; font-size: 18px; }
    .quote cite { display: block; margin-top: 4px; font-style: normal; font-size: 14px; color: var(--silver); }
    .quote cite::before { content: "— "; }

    .card {
      background: var(--card);
      border: 2px solid var(--line);
      border-top: 6px solid var(--brand);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(10, 30, 90, .08);
    }
    h2 { font-family: "Rye", serif; font-weight: 400; }
    .field { margin-bottom: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }

    label, .label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 15px; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      color: inherit;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      min-height: 48px;
    }
    textarea { min-height: 96px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      outline: 3px solid var(--brand-soft);
      border-color: var(--brand);
    }
    .money { position: relative; }
    .money span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .money input { padding-left: 26px; }

    #other-field { background: var(--brand-soft); border-radius: 12px; padding: 12px; }

    /* Photo */
    .photo-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .photo-buttons label {
      flex: 1 1 140px;
      margin: 0;
      text-align: center;
      font-weight: 600;
      border: 2px dashed var(--brand);
      color: var(--brand-dark);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
    }
    .photo-buttons label:hover { background: var(--brand-soft); }
    .photo-buttons input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .photo-buttons input:focus-visible + span { outline: 3px solid var(--brand); }
    #preview { margin-top: 12px; position: relative; }
    #preview img { display: block; max-width: 100%; max-height: 360px; border-radius: 12px; border: 1px solid var(--line); }
    #remove-photo {
      margin-top: 8px;
      background: none; border: none; padding: 4px 0;
      color: var(--error); font: inherit; font-weight: 600; cursor: pointer;
    }

    button.primary {
      width: 100%;
      font: inherit; font-weight: 600; font-size: 18px;
      color: #fff; background: var(--brand);
      border: none; border-radius: 12px;
      padding: 14px; min-height: 52px;
      cursor: pointer;
    }
    button.primary:hover { background: var(--brand-dark); }
    button.primary:disabled { opacity: .6; cursor: wait; }

    .message { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
    .message.error { background: var(--error-soft); color: var(--error); }
    .notice { background: #fff7e0; color: #6b4e00; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 15px; }

    #thanks { text-align: center; }
    #thanks h2 { margin: 4px 0 6px; }
    #thanks p { color: var(--muted); margin: 0 0 18px; }
    .check {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--brand-soft); color: var(--brand);
      display: grid; place-items: center; margin: 0 auto 8px;
      font-size: 30px; font-weight: 700;
    }
    .required { color: var(--error); }
    .visually-hidden { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

    /* Money and hay bales falling after a receipt is saved */
    #rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
    .drop {
      position: absolute;
      top: -120px;
      animation: fall linear forwards;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .2));
    }
    .drop svg { display: block; width: 100%; height: auto; animation: spin ease-in-out infinite alternate; }
    @keyframes fall { to { transform: translateY(calc(100vh + 160px)); } }
    @keyframes spin { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><span class="accent">Robinette Ranch</span> Expense Tracking</h1>
      <!-- Replaced with a random quote from dallastvshow.com when the page opens -->
      <blockquote class="quote">
        <p id="quote-text">“Once you get rid of integrity, the rest is a piece of cake.”</p>
        <cite><span id="quote-who">J.R. Ewing</span>, <em>Dallas</em></cite>
      </blockquote>
    </header>

    <p id="setup-notice" class="notice" hidden>Preview only: receipts aren't being saved yet. They'll go to your Google Sheet once it's connected.</p>

    <form id="receipt-form" class="card" novalidate>
      <div id="form-error" class="message error" role="alert" hidden></div>

      <div class="row">
        <div class="field">
          <label for="date">Date <span class="required">*</span></label>
          <input id="date" name="date" type="date" required>
        </div>
        <div class="field">
          <label for="amount">Total amount <span class="required">*</span></label>
          <div class="money">
            <span>$</span>
            <input id="amount" name="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="vendor">Store or vendor <span class="required">*</span></label>
        <input id="vendor" name="vendor" type="text" autocomplete="off" placeholder="e.g. Home Depot" required>
      </div>

      <div class="field">
        <label for="payment">How was it paid?</label>
        <select id="payment" name="payment">
          <option value="">Choose one</option>
          <option>Business credit card</option>
          <option>Business debit card</option>
          <option>Personal card</option>
          <option>Cash</option>
          <option>Check</option>
          <option>Bank transfer</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label for="category">Tax category <span class="required">*</span></label>
        <select id="category" name="category" required>
          <option value="">Choose a category</option>
          <option>Advertising &amp; marketing</option>
          <option>Bank &amp; merchant fees</option>
          <option>Car &amp; truck expenses</option>
          <option>Contract labor</option>
          <option>Education &amp; training</option>
          <option>Equipment</option>
          <option>Insurance</option>
          <option>Legal &amp; professional services</option>
          <option>Meals (business)</option>
          <option>Office expenses</option>
          <option>Phone &amp; internet</option>
          <option>Postage &amp; shipping</option>
          <option>Rent or lease</option>
          <option>Repairs &amp; maintenance</option>
          <option>Software &amp; subscriptions</option>
          <option>Supplies</option>
          <option>Taxes &amp; licenses</option>
          <option>Travel</option>
          <option>Utilities</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field" id="other-field" hidden>
        <label for="other">What was it for? <span class="required">*</span></label>
        <input id="other" name="other" type="text" autocomplete="off" placeholder="Describe the expense">
      </div>

      <div class="field">
        <label for="notes">Notes <span class="hint">(optional)</span></label>
        <textarea id="notes" name="notes" placeholder="Anything to remember about this purchase"></textarea>
      </div>

      <div class="field">
        <span class="label">Receipt photo <span class="hint">(optional)</span></span>
        <div class="photo-buttons">
          <label>
            <input id="photo-camera" type="file" accept="image/*" capture="environment">
            <span>📷 Take a photo</span>
          </label>
          <label>
            <input id="photo-file" type="file" accept="image/*">
            <span>🖼️ Choose a photo</span>
          </label>
        </div>
        <div id="preview" hidden>
          <img id="preview-img" alt="Receipt photo preview">
          <button type="button" id="remove-photo">Remove photo</button>
        </div>
      </div>

      <input type="text" name="hp_field" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" class="primary" id="save">Save receipt</button>
    </form>

    <section id="thanks" class="card" hidden tabindex="-1">
      <div class="check" aria-hidden="true">✓</div>
      <h2>Receipt saved</h2>
      <p id="thanks-detail"></p>
      <button type="button" class="primary" id="another">Add another receipt</button>
    </section>
  </main>
  <div id="rain" aria-hidden="true"></div>

  <script>
  (function () {
    // ===== Settings =====
    // The address of the Google Sheet connection (from Apps Script > Deploy).
    // Leave empty to try the page without saving anything.
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxKEjKByKIeVHSq8gvqOGb2SNG8uZ84jcfwT7ZmZQmYN8x_GSrzD-dwYnwNE6bhfdHYBQ/exec';
    // Receipt photos are shrunk to this many pixels on the long side before sending.
    const PHOTO_MAX_SIZE = 2000;
    // ====================

    const form = document.getElementById('receipt-form');
    const formError = document.getElementById('form-error');
    const category = document.getElementById('category');
    const otherField = document.getElementById('other-field');
    const otherInput = document.getElementById('other');
    const cameraInput = document.getElementById('photo-camera');
    const fileInput = document.getElementById('photo-file');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('preview-img');
    const saveButton = document.getElementById('save');
    const thanks = document.getElementById('thanks');
    let photoFile = null;
    let previewUrl = null;

    if (!SHEET_URL) document.getElementById('setup-notice').hidden = false;

    // ----- A different Dallas quote each visit (the J.R. line stays if it can't load) -----
    async function loadQuote() {
      if (!SHEET_URL) return;
      try {
        const response = await fetch(SHEET_URL + '?action=quote');
        const result = await response.json();
        if (!result.ok || !result.quote) return;
        document.getElementById('quote-text').textContent = '“' + result.quote + '”';
        document.getElementById('quote-who').textContent = result.who || 'Dallas';
      } catch (err) {
        // keep the quote that's already showing
      }
    }
    loadQuote();

    function today() {
      const d = new Date();
      const pad = function (n) { return String(n).padStart(2, '0'); };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    form.elements.date.value = today();

    // ----- "Other" box appears only when Other is picked -----
    category.addEventListener('change', function () {
      const isOther = category.value === 'Other';
      otherField.hidden = !isOther;
      otherInput.required = isOther;
      if (isOther) otherInput.focus();
      else otherInput.value = '';
    });

    // ----- Photo -----
    function setPhoto(file) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      photoFile = file || null;
      previewUrl = photoFile ? URL.createObjectURL(photoFile) : null;
      previewImg.src = previewUrl || '';
      preview.hidden = !photoFile;
    }
    [cameraInput, fileInput].forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.files[0]) setPhoto(input.files[0]);
        input.value = ''; // lets the same photo be picked again after removing it
      });
    });
    document.getElementById('remove-photo').addEventListener('click', function () { setPhoto(null); });

    // Phone photos are large. Shrink before sending so it uploads quickly.
    function shrinkPhoto(file) {
      return new Promise(function (resolve, reject) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = function () {
          const scale = Math.min(1, PHOTO_MAX_SIZE / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve({ type: 'image/jpeg', data: canvas.toDataURL('image/jpeg', 0.85).split(',')[1] });
        };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error('photo'));
        };
        img.src = url;
      });
    }

    // ----- Checking the boxes -----
    function value(name) { return String(form.elements[name].value).trim(); }

    function problems() {
      const list = [];
      if (!value('date')) list.push('the date');
      const amount = value('amount');
      if (!amount || isNaN(Number(amount)) || Number(amount) < 0) list.push('the total amount');
      if (!value('vendor')) list.push('the store or vendor');
      if (!value('category')) list.push('a tax category');
      else if (value('category') === 'Other' && !value('other')) list.push('what the expense was for');
      return list;
    }

    function showError(text) {
      formError.textContent = text;
      formError.hidden = false;
      formError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ----- Celebration: stacks of money and hay bales rain down -----
    const MONEY_SVG =
      '<svg viewBox="0 0 100 74" xmlns="http://www.w3.org/2000/svg">' +
        [0, 1, 2].map(function (i) {
          const y = 44 - i * 14;
          return '<rect x="' + (4 + i * 3) + '" y="' + y + '" width="88" height="26" rx="3" fill="#2f7d3a" stroke="#1d5426" stroke-width="2"/>' +
                 '<rect x="' + (10 + i * 3) + '" y="' + (y + 5) + '" width="76" height="16" rx="2" fill="#9fd58b"/>' +
                 '<circle cx="' + (48 + i * 3) + '" cy="' + (y + 13) + '" r="6" fill="#2f7d3a"/>';
        }).join('') +
        '<rect x="40" y="14" width="18" height="56" fill="#f5e6b8" stroke="#c9a94f" stroke-width="1.5"/>' +
        '<text x="49" y="47" font-family="Georgia, serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1d5426">$</text>' +
      '</svg>';
    const HAY_SVG =
      '<svg viewBox="0 0 100 64" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="2" y="4" width="96" height="56" rx="6" fill="#e3b94c" stroke="#a87b22" stroke-width="2.5"/>' +
        '<g stroke="#b88a2e" stroke-width="1.5" stroke-linecap="round">' +
          '<path d="M10 14h18M34 12h14M58 15h22M14 26h12M40 24h20M66 27h16M8 38h20M36 36h10M54 39h24M12 50h16M38 49h22M70 51h14"/>' +
        '</g>' +
        '<g stroke="#f6dc8a" stroke-width="1.2" stroke-linecap="round">' +
          '<path d="M16 20h10M44 18h12M70 21h12M10 32h14M46 31h16M22 44h12M60 45h14"/>' +
        '</g>' +
        '<rect x="22" y="3" width="6" height="58" fill="#7a4a1e"/>' +
        '<rect x="72" y="3" width="6" height="58" fill="#7a4a1e"/>' +
      '</svg>';
    const RAIN_PIECES = 40;
    const rain = document.getElementById('rain');

    function makeItRain() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (let i = 0; i < RAIN_PIECES; i++) {
        const drop = document.createElement('div');
        drop.className = 'drop';
        const isMoney = i % 2 === 0;
        drop.innerHTML = isMoney ? MONEY_SVG : HAY_SVG; // fixed pictures, no typed text
        const size = 44 + Math.random() * 40;
        drop.style.width = size + 'px';
        drop.style.left = (Math.random() * 100) + 'vw';
        drop.style.marginLeft = (-size / 2) + 'px';
        const duration = 2.4 + Math.random() * 2;
        const delay = Math.random() * 1.8;
        drop.style.animationDuration = duration + 's';
        drop.style.animationDelay = delay + 's';
        drop.firstChild.style.animationDuration = (0.6 + Math.random() * 0.8) + 's';
        rain.appendChild(drop);
        setTimeout(function () { drop.remove(); }, (duration + delay) * 1000 + 200);
      }
    }

    async function send(data) {
      // Sent as plain text so the browser doesn't need a permission check with Google first
      const response = await fetch(SHEET_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || 'not saved');
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      formError.hidden = true;

      const missing = problems();
      if (missing.length) {
        showError('Please add ' + missing.join(', ') + '.');
        return;
      }

      const data = {
        hp_field: value('hp_field'),
        date: value('date'),
        vendor: value('vendor'),
        amount: Number(value('amount')).toFixed(2),
        payment: value('payment'),
        category: value('category'),
        other: value('category') === 'Other' ? value('other') : '',
        notes: value('notes')
      };

      saveButton.disabled = true;
      saveButton.textContent = 'Saving…';
      try {
        if (photoFile) data.photo = await shrinkPhoto(photoFile);
        if (SHEET_URL) await send(data);
      } catch (err) {
        showError(err.message === 'photo'
          ? "Sorry, that photo couldn't be read. Please remove it and try another."
          : "Sorry, that didn't save. Please check your connection and try again.");
        return;
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Save receipt';
      }

      document.getElementById('thanks-detail').textContent =
        '$' + data.amount + ' at ' + data.vendor + (SHEET_URL ? ' was added to your Google Sheet.' : ' (preview only, not saved).');
      form.hidden = true;
      thanks.hidden = false;
      thanks.focus();
      window.scrollTo(0, 0);
      makeItRain();
    });

    document.getElementById('another').addEventListener('click', function () {
      form.reset();
      form.elements.date.value = today();
      otherField.hidden = true;
      otherInput.required = false;
      setPhoto(null);
      thanks.hidden = true;
      form.hidden = false;
      form.elements.amount.focus();
    });
  })();
  </script>
</body>
</html>
